<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>미리보기</title>
<!--
  진짜 수업 체험의 미리보기 틀(labs/parts/Sandbox.jsx). 앱 화면에 sandbox="allow-scripts"(같은 출처 권한 없음)로 들어가서,
  부모가 보내 준 문서(사용자가 쓴 HTML·CSS·JS와 검사기)를 그대로 그린다.
  srcdoc은 앱의 보안 정책(script-src 'self')을 물려받아 안의 스크립트가 돌지 않으므로, 이 페이지는 따로 정책을 받는다(vercel.json).
-->
</head>
<body>
<script>
  var written = false;
  addEventListener("message", function (event) {
    var data = event.data;
    if (written || event.source !== parent || !data || data.type !== "campushi-lab-doc" || typeof data.html !== "string") return;
    written = true;
    document.open();
    document.write(data.html);
    document.close();
  });
  parent.postMessage({ type: "campushi-lab-ready" }, "*");
</script>
</body>
</html>
