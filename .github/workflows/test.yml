# 푸시와 PR마다 프론트 테스트·빌드와 백엔드 테스트를 GitHub 서버에서 돌린다.
# 결과는 커밋 옆에 ✅/❌로 보이고, 실패하면 푸시한 사람에게 메일이 간다.
name: 테스트

on:
  push:
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 새로 푸시하면 이전에 돌던 검사는 멈춘다.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 프론트 테스트·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm test
      - run: npm run build

  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Vercel 서버리스 함수의 기본 파이썬 버전에 맞춘다.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-test.txt
      - run: python -m unittest backend.test_api
